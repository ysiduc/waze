name: Validate Original IPA Packaging & Integrity

on:
  workflow_dispatch:
    inputs:
      bundle_source_url:
        description: "Authorized private URL for original Waze.app bundle archive (Leave empty to run synthetic structure validation)"
        required: false
        default: ""

jobs:
  validate-and-package:
    name: Validate Application Bundle & Repackaging Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Research Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Script Syntax and Linter Check
        run: |
          python3 -m py_compile scripts/repackage_and_validate.py
          echo "Packaging script syntax verification passed."

      - name: Execute Validation Mode
        run: |
          mkdir -p build_output reports_output
          
          EXPECTED_BINARY_SHA256="0c40c247228439e2b75baca181569c75c144918561a8177e9399b183b5709d80"
          
          if [ -n "${{ github.event.inputs.bundle_source_url }}" ]; then
            echo "================================================================================"
            echo "MODE: REAL APPLICATION BUNDLE VALIDATION"
            echo "Authorized private bundle URL provided. Downloading unencrypted bundle archive..."
            echo "================================================================================"
            curl -sSL "${{ github.event.inputs.bundle_source_url }}" -o /tmp/waze_bundle.tar.gz
            mkdir -p /tmp/extracted_bundle
            tar -xzf /tmp/waze_bundle.tar.gz -C /tmp/extracted_bundle
            
            APP_DIR=$(find /tmp/extracted_bundle -name "Waze.app" -type d | head -n 1)
            if [ -z "$APP_DIR" ]; then
              echo "Error: Waze.app not found in downloaded archive."
              exit 1
            fi
            
            # Verify main executable hash before packaging
            MAIN_BIN="$APP_DIR/Waze"
            ACTUAL_HASH=$(sha256sum "$MAIN_BIN" | awk '{print $1}')
            echo "Actual Main Binary SHA-256:   $ACTUAL_HASH"
            echo "Expected Main Binary SHA-256: $EXPECTED_BINARY_SHA256"
            
            if [ "$ACTUAL_HASH" != "$EXPECTED_BINARY_SHA256" ]; then
              echo "ERROR: Binary hash mismatch! Expected $EXPECTED_BINARY_SHA256, got $ACTUAL_HASH"
              exit 1
            fi
            echo "Binary hash verified successfully."
            
            echo "Running full audit and repackaging on authorized bundle..."
            python3 scripts/repackage_and_validate.py \
              --app-dir "$APP_DIR" \
              --output-ipa build_output/Waze-repackaged.ipa
              
            cat << EOF > reports_output/CI_PACKAGE_VALIDATION_REPORT.md
# CI Package Validation & Integrity Report: REAL BUNDLE MODE

- **Validation Mode:** REAL APPLICATION BUNDLE (Authorized Private Source)
- **Workflow:** Validate Original IPA Packaging & Integrity
- **Trigger:** workflow_dispatch
- **Main Binary Hash Verification:** PASSED
  - Verified SHA-256: \`$ACTUAL_HASH\`
- **Application Bundle Integrity:** Verified with all internal frameworks, plugins, and resources.
- **Automated Code Signing:** NOT PERFORMED (Intentionally omitted; user-managed developer signing required)
- **Installability Status:** UNVERIFIED / PENDING (Cannot claim installable until developer-signed and tested on physical iPhone hardware)
EOF

          else
            echo "================================================================================"
            echo "MODE: SYNTHETIC STRUCTURE VALIDATION (Public CI Environment)"
            echo "Proprietary third-party binaries (waze.ipa, Waze Mach-O, assets) are strictly"
            echo "excluded from public repository storage per copyright and distribution compliance."
            echo "Executing structural compliance verification using synthetic test bundle..."
            echo "================================================================================"
            
            mkdir -p /tmp/synthetic/Payload/Waze.app/_CodeSignature
            mkdir -p /tmp/synthetic/Payload/Waze.app/Frameworks/SpotifyiOS.framework
            mkdir -p /tmp/synthetic/Payload/Waze.app/PlugIns/NotificationExtension.appex
            mkdir -p /tmp/synthetic/Payload/Waze.app/PlugIns/WazeShareExtension.appex
            
            cat << 'EOF' > /tmp/synthetic/Payload/Waze.app/Info.plist
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleIdentifier</key>
    <string>com.waze.iphone</string>
    <key>CFBundleShortVersionString</key>
    <string>5.22.0</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>MinimumOSVersion</key>
    <string>16.0</string>
</dict>
</plist>
EOF
            touch /tmp/synthetic/Payload/Waze.app/_CodeSignature/CodeResources
            touch /tmp/synthetic/Payload/Waze.app/Assets.car
            
            # Create minimal ARM64 Mach-O mock headers for structure tests
            python3 -c "
import struct
header = struct.pack('<IIIIIIII', 0xfeedfacf, 0x0100000c, 0, 2, 0, 0, 0, 0)
for p in ['/tmp/synthetic/Payload/Waze.app/Waze',
          '/tmp/synthetic/Payload/Waze.app/Frameworks/SpotifyiOS.framework/SpotifyiOS',
          '/tmp/synthetic/Payload/Waze.app/PlugIns/NotificationExtension.appex/NotificationExtension',
          '/tmp/synthetic/Payload/Waze.app/PlugIns/WazeShareExtension.appex/WazeShareExtension']:
    with open(p, 'wb') as f:
        f.write(header)
"
            python3 scripts/repackage_and_validate.py \
              --app-dir /tmp/synthetic/Payload/Waze.app \
              --output-ipa build_output/Synthetic-validation.ipa
              
            cat << 'EOF' > reports_output/CI_PACKAGE_VALIDATION_REPORT.md
# CI Package Validation & Integrity Report: SYNTHETIC TEST MODE

- **Validation Mode:** SYNTHETIC STRUCTURE TEST (Public CI Environment)
- **Workflow:** Validate Original IPA Packaging & Integrity
- **Trigger:** workflow_dispatch
- **Real Binary Tested:** NO (Proprietary assets excluded from public GitHub storage)
- **Expected Real Binary SHA-256:** `0c40c247228439e2b75baca181569c75c144918561a8177e9399b183b5709d80`
- **Synthetic Structure Audit:** PASSED (Validates directory hierarchy, ZIP packaging, and Mach-O header parsing)
- **Automated Code Signing:** NOT PERFORMED (Intentionally omitted; user-managed signing required)
- **Installability Status:** UNVERIFIED / PENDING (Synthetic package cannot be installed)
- **Local Real Testing Instructions:** Execute `scripts/repackage_and_validate.py` in the local Arch Linux research environment where original `waze.ipa` is present.
EOF
          fi
          cat reports_output/CI_PACKAGE_VALIDATION_REPORT.md

      - name: Upload Validation Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-validation-report
          path: reports_output/
